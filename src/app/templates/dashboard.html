{% extends "base.html" %}

{% block title %}VizSciFlow - Progress Dashboard{% endblock %}

{% block head %}
{{ super() }}
<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='game.css') }}">
{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Progress Dashboard</h1>
</div>

<div>
    <h3>Level: {{ "Novice" }}</h3>
</div>

<div id="progress-bar-container">
    <label id="progress-bar-label" for="progress-bar">Progress: [{{ "0/100 pts" }}]</label>
    <meter id="progress-bar" value="0" min="0" max="100" ></meter>
</div>

<div>
    <h3>Streak: {{ "0 Days" }}</h3>
</div>

{% endblock %}
